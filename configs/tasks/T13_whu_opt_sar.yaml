task_id: T13
application: Land cover (GF-1 optical, WHU-OPT-SAR, Hubei; image-only deployment route)
dataset_id: WHU-OPT-SAR
family: segmentation
sensor: gf-1
time_steps: 1
# File order of the optical tifs; checked from class means (forest has the
# highest 4th band, water the lowest).
bands: [RED, GREEN, BLUE, NIR_BROAD]
# Labels {0, 10, ..., 70} map to {0..7} (value // 10): 0 background, 1 farmland,
# 2 city, 3 village, 4 water, 5 forest, 6 road, 7 other. Background is 0.001% of
# the pixels and is ignored in the loss (plan v3.4 §3); metrics are over 1..7.
num_outputs: 8
ignore_index: 0
primary_metric:
  name: mean_iou
  direction: maximize
official_config_url: https://github.com/AmberHen/WHU-OPT-SAR-dataset
allowed_splits: [train, validation, test]
required_splits: [train, validation, test]
notes:
  updated: 2026-11-17
  summary: "WHU-OPT-SAR 光学分支：100 幅湖北 GF-1 图幅，官方 80/20；train 中固定留 8 幅作 validation。"
  findings:
    - "影像无地理参考，按 1:50,000 图幅号解码为 CGCS2000 经纬度仿射，写进每行 transform。"
    - "512 切片、步长 384、末块贴边（无填充）；group_id = 图幅号。"
  caveats:
    - "相邻图幅共享边界：是图幅级隔离，不是空间独立。"
    - "像元约 4.32 m（东西）× 5.01 m（南北），5 m 只在纬向成立。"
    - "影像拍摄年份未核实；AEF 教师年份在 run tags 里单独记录。"
