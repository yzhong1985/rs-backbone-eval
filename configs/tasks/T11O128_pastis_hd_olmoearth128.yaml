notes:
  updated: 2026-11-08
  summary: >-
    T11O128 与 T11/T11O 使用完全相同的 PASTIS-HD patch、标签和 Fold 划分，输入是
    OlmoEarth v1.3 2019 年度 embedding 的完整 128 维（64 维是其 Matryoshka 前缀）。
    用于判断 64 维是否截断了有用信息，单独成 cell。
  findings:
    - "样本与 T11/T11O 一一对应：test 496 / validation 482 / train 1,455；对比固定同一份 manifest。"
    - "编码：OlmoEarth int8（-128=NODATA），Dequantize 为 sign(v)*(|v|/127.5)^2；sidecar 声明 quantization=olmoearth_int8、dims=128。"
    - "训练协议与 64 维完全一致：AEF worker 的 MLP/UPerNet 头、lr 3e-3/1e-3、固定第 8 轮、seed 17/42/73、CPU。"
    - "128 维不是 64 维 cell 的替代：两者分轨（BOE128/BOEM128 vs BOE/BOEM），报告里并列。"
  caveats:
    - "与 64 维的差异是输入预算差异，不是模型差异；不能把提升归因到产品本身。"
    - "OlmoEarth 的预训练输入含 S1/S2/Landsat；AEF 也是多模态。产品差异不能归因到单一传感器。"
    - "本 task 不并入 Prithvi-suite D1，也不与 T11 的 BBF/BBT 全量微调混排。"
    - "主口径沿用 AEF worker：无效像元特征置零但标签全范围参与 loss/mIoU（zero-fill-full-label）。"
    - "LPIS 标签年按 2019 处理（与 T11 相同的技术验证假设）。"
