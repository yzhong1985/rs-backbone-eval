task_id: T3
application: Burn Scar Intensity
dataset_id: burn_intensity
family: segmentation
sensor: hls
time_steps: 3
bands: [BLUE, GREEN, RED, NIR, SWIR_1, SWIR_2]
num_outputs: 5
ignore_index: -1
background_class: 0  # class 0 = no-burn, the dominant non-target class
primary_metric:
  name: mean_iou
  direction: maximize
official_config_url: https://github.com/NASA-IMPACT/Prithvi-EO-2.0/blob/main/configs/burnintensity.yaml
notes:
  updated: 2026-10-28
  summary: "所有模型都远低于论文（29.4）；去掉背景后只有 0.05–0.08，强度类基本没有学到；加训练轮数也救不回来。"
  findings:
    - "mIoU 0.148–0.196，而全预测背景的平凡解是 0.141。"
    - "剔除无火烧类后仅 0.051–0.084，模型之间无实质差异。"
    - "Prithvi B1 的 0.196 看似最高，但去掉背景后为 0.084，不构成能力证据。"
    - "epoch 探针（B0 协议、各 3 种子）：50/100/150 epoch 为 0.1539/0.1530/0.1529，轮数不是低分原因。"
  caveats:
    - "训练轮数已排除：B0 协议下 50/100/150 epoch 的 mIoU 为 0.1539/0.1530/0.1529，加轮数没有任何增益。"
    - "5 类严重程度极不平衡，指标本身区分度有限。"
