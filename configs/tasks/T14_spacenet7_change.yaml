task_id: T14
application: Urban change (building construction between consecutive monthly Planet basemaps; SpaceNet 7, 101 AOIs)
dataset_id: SpaceNet-7
family: change
sensor: planetscope
# Each sample is a pair of consecutive monthly basemaps (t1, t2) of the same AOI.
time_steps: 2
# Planet basemaps are visual RGB; the alpha band is a validity mask, not a spectral band.
bands: [RED, GREEN, BLUE]
# Binary: 0 = no new building, 1 = building present at t2 and absent at t1.
num_outputs: 2
ignore_index: 255  # cloud/unusable pixels (UDM of t1 or t2); never a class
background_class: 0
primary_metric:
  name: change_f1
  direction: maximize
official_config_url: https://spacenet.ai/sn7-challenge/
allowed_splits: [train, validation, test]
required_splits: [train, validation, test]
notes:
  updated: 2026-11-18
  summary: "SpaceNet 7（MUDS）变化标签从相邻月份的建筑轮廓差分得到；manifest 构建器已实现（相邻月份配对，AOI 级切分）；变化掩膜栅格与孪生变化头尚未实现。"
  findings:
    - "样本区域 EPSG:3857，4.78 m 墨卡托像元（约 4.1 m 地面），与 AEF 的 10 m 网格对应。"
    - "影像为 Planet 月度镶嵌图，alpha 通道标记有效像元，不是光谱波段。"
    - "2018–2019 样本区域的 AEF 2018/2019 全部有效（10 m 全分辨率，单一区域）。"
  caveats:
    - "变化标签只覆盖建筑物，不是通用变化；建设事件类别极不平衡。"
    - "标签是 geojson 多边形，栅格化对齐方式尚未核对。"
    - "全部 101 个区域的 AEF 覆盖尚未检查。"
