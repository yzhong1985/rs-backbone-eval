task_id: T10V
application: Fine-grained Rotated Object Detection (FAIR1M-1.0 val holdout)
dataset_id: FAIR1M
family: detection
sensor: aerial-rgb
time_steps: 1
bands: [RED, GREEN, BLUE]
num_outputs: 37          # FAIR1M-2.0 class taxonomy, five published groups
# Detection has no ignore class; partially visible objects are ignored by the
# detector matcher, not by a label value.
ignore_index: null
background_class: null
primary_metric:
  name: map
  direction: maximize
official_config_url: https://www.gaofen-challenge.com/benchmark
allowed_splits: [train, validation, test]
required_splits: [train, test]
notes:
  updated: 2026-11-06
  summary: >-
    T10V 是 T10 的**外部图像 holdout**版本：使用本地 FAIR1M-1.0 val 图像/标注作为 test，
    train 与 validation 从 FAIR1M-1.0 train 中按 group 划分；类别仍用 FAIR1M-2.0 的 37 类。
  findings:
    - "T10 现有分数是 FAIR1M train 内部 holdout；T10V 把 test 换成本地 1.0 val，回答‘换一批图像是否还能保持’的问题。"
    - "本地 FAIR1M2 镜像的 val 是 1.0 val，不是官方 2.0 val；T10V 不宣称官方 2.0 test 分数。"
    - "train/validation 从 1.0 train 按 group 切分；test 是 1.0 val，不参与训练。"
    - "类别、tile 1024/stride 824、keep_ratio 0.7、mAP（COCO AP@[.5:.95]）与 T10 相同，便于直接对照。"
  caveats:
    - "不是官方 FAIR1M-2.0 leaderboard：官方 2.0 val/test 尚未取得，T10V 只是本地 1.0 val holdout。"
    - "FAIR1M 标注无逐图 GSD；沿用声明 0.5 m，gsd_source=declared。"
    - "LIM 预训练源与 FAIR1M 是否同源未排除；T10V 仍是同分布/近分布留出，不作严格未见区域结论。"
    - "若后续拿到官方 2.0 val/test，应新建 T10O，不覆盖 T10V。"
