task_id: T11O
application: Agricultural Parcel Semantic Segmentation (PASTIS-HD, OlmoEarth v1.3 annual-embedding track)
dataset_id: PASTIS-HD
family: segmentation
sensor: olmoearth_v1_3_embedding   # precomputed annual embedding product, not a sensor raster
input_kind: embedding_features
time_steps: 1          # one annual composite per sample
bands: [OLE_00, OLE_01, OLE_02, OLE_03, OLE_04, OLE_05, OLE_06, OLE_07, OLE_08, OLE_09,
       OLE_10, OLE_11, OLE_12, OLE_13, OLE_14, OLE_15, OLE_16, OLE_17, OLE_18, OLE_19,
       OLE_20, OLE_21, OLE_22, OLE_23, OLE_24, OLE_25, OLE_26, OLE_27, OLE_28, OLE_29,
       OLE_30, OLE_31, OLE_32, OLE_33, OLE_34, OLE_35, OLE_36, OLE_37, OLE_38, OLE_39,
       OLE_40, OLE_41, OLE_42, OLE_43, OLE_44, OLE_45, OLE_46, OLE_47, OLE_48, OLE_49,
       OLE_50, OLE_51, OLE_52, OLE_53, OLE_54, OLE_55, OLE_56, OLE_57, OLE_58, OLE_59,
       OLE_60, OLE_61, OLE_62, OLE_63]
num_outputs: 20        # background 0, crops 1-18, void 19
ignore_index: 19
background_class: 0
primary_metric:
  name: mean_iou
  direction: maximize
official_config_url: https://source.coop/olmoearth/olmoearth-v1-3-embeddings
allowed_splits: [train, validation, test]
required_splits: [train, test]
notes:
  updated: 2026-11-07
  summary: >-
    T11O 与 T11 使用完全相同的 PASTIS-HD patch、标签和 Fold 1-3/4/5 划分，只把输入
    产品从 AEF 2019 换成 OlmoEarth v1.3 2019 年度合成 embedding（64×128×128，
    Source Cooperative Zarr，10 m 网格）。用途是“年度 embedding 产品”对照，不是
    backbone 排名。
  findings:
    - "样本必须与 T11 一一对应：test 496 / validation 482 / train 1,455，sample_id 为 patch id；两边对比固定同一份 manifest。"
    - "编码：OlmoEarth int8（-128=NODATA），Dequantize 为 sign(v)*(|v|/127.5)^2；sidecar 声明 quantization=olmoearth_int8。"
    - "64 维是 128 维 Matryoshka 前缀；128 维若运行，单独建 task/cell，不并入本 64 维 cell。"
    - "对齐采用 24-patch QC 后的 10 m 网格（最近像元），残余不确定性约 ±1 像元；不做平移修正，报告需写明。"
  caveats:
    - "OlmoEarth 的预训练输入含 S1/S2/Landsat 且产品是年度合成；AEF 也基于 S2 年度合成。两者差异只能解释为产品差异，不能归因到单一传感器。"
    - "本 task 不并入 Prithvi-suite D1，也不与 T11 的 BBF/BBT 全量微调混排。"
    - "主口径沿用 AEF worker：无效像元特征置零但标签全范围参与 loss/mIoU（zero-fill-full-label）；valid-mask 诊断不进入 headline。"
    - "LPIS 标签年按 2019 处理（与 T11 相同的技术验证假设）。"
