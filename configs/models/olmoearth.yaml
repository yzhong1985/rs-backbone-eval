model_id: olmoearth_v1_2_tiny
display_name: OlmoEarth v1.2 Tiny
worker_id: olmoearth
checkpoint_env: OLMOEARTH_CHECKPOINT
upstream_url: https://github.com/allenai/olmoearth_pretrain
# Stage A probe and stage B head training are implemented in the worker; the
# weight/config download entry is already registered and verified (sha256
# matches). Keep enabled until a real smoke run has passed end to end.
enabled: true
worker_command: [uv, run, --project, workers/olmoearth, python, workers/olmoearth/src/olmoearth_worker/runner.py]
