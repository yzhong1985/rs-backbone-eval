[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rs-backbone-eval"
version = "0.1.0"
description = "Protocol-driven evaluation of AnySat, Clay, and Prithvi on multispectral downstream tasks"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
  "numpy>=1.26",
  "pydantic>=2.9",
  "python-dotenv>=1.0",
  "rich>=13.9",
  "typer>=0.12",
]

[project.optional-dependencies]
portal = [
  "anyio>=4.4,<4.8",
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.32,<0.35",
]
downloads = [
  "huggingface-hub>=0.27,<2",
]
dev = [
  "httpx>=0.27,<0.28",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
rs-eval = "rs_backbone_eval.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rs_backbone_eval"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
