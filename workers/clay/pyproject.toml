[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clay-worker"
version = "0.1.0"
description = "Isolated Clay v1.5 worker environment (official package pinned)"
requires-python = ">=3.11"
dependencies = [
  "rs-backbone-eval",
  "claymodel==1.5.0",
  "rasterio>=1.4",
]

[tool.uv.sources]
rs-backbone-eval = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/clay_worker"]
