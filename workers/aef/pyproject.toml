[project]
name = "aef-worker"
version = "0.1.0"
description = "Frozen-AEF segmentation worker for the T11 registry runs"
requires-python = ">=3.11"
dependencies = [
  "rs-backbone-eval",
  "numpy>=1.26",
  "torch>=2.4",
  "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aef_worker"]

[tool.uv.sources]
rs-backbone-eval = { path = "../..", editable = true }
