[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prithvi-worker"
version = "0.1.0"
description = "Isolated Prithvi-EO-2.0 worker environment (TerraTorch pinned)"
requires-python = ">=3.11"
dependencies = [
  "rs-backbone-eval",
  "rasterio>=1.4",
  "terratorch>=1.2,<1.3",
]

[tool.uv.sources]
rs-backbone-eval = { path = "../..", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/prithvi_worker"]
